<!doctype html>
<html lang="zh-CN" data-lang="apple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录</title>
<meta name="ui:title" content="登录">
<meta name="ui:desc" content="登录页：品牌标志、邮箱与密码输入（显示/隐藏密码）、忘记密码、通行密钥，以及平台对应的通过 Apple / Google 登录。">
<meta name="ui:category" content="引导与账户">
<meta name="ui:platform" content="phone">
<meta name="ui:tags" content="登录,表单,通行密钥,第三方登录,分隔线">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../kit/icons.js"></script>
<script src="../../kit/ui.js"></script>
<style>
  .si { display: flex; flex-direction: column; padding-top: 4px; }
  .si-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin-bottom: 28px; }
  .si-logo { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 10px; border-radius: 18px;
    background: linear-gradient(150deg, var(--c-orange), var(--c-pink)); color: #fff; box-shadow: var(--ui-shadow-2); }
  html[data-lang="google"] .si-logo { border-radius: 50%; }
  .si-logo .i { --ui-icon: 34px; }
  .si-forgot { align-self: flex-end; margin: -6px 4px -2px 0; }
  /* .field 里包一层 .field-affix 时，Google 的浮动标签需要页面补上（标签固定在上浮位置） */
  html[data-lang="google"] .si-field { display: grid; }
  html[data-lang="google"] .si-field > .field-label { grid-area: 1 / 1; z-index: 1; justify-self: start; align-self: start; margin: -8px 0 0 12px; padding: 0 4px;
    font-size: calc(12px * var(--ts)); line-height: 16px; font-weight: 400; background: var(--ui-bg); }
  html[data-lang="google"] .si-field > .field-affix { grid-area: 1 / 1; }
  .si-field .field-input { padding-right: 52px; }
  .si-field .affix-end { --b-fg: var(--ui-text-2); }
  .si .divider.label { margin: 24px 0; }
  .si-glyph { width: 20px; height: 20px; flex: none; }
  .si-apple { --b-bg: var(--ui-text); --b-fg: var(--ui-bg-plain); }
  .si-google { --b-fg: var(--ui-text); }
  .si-foot { margin-top: 28px; text-align: center; }
</style>
</head>
<body class="app">
<div class="screen">
  <header class="topbar">
    <div class="topbar-lead"><button class="bar-btn" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="topbar-title"></div>
    <div class="topbar-trail"><button class="bar-btn" aria-label="帮助"><svg class="i"><use href="#i-help"/></svg></button></div>
  </header>

  <main class="content si">
    <div class="si-head">
      <span class="si-logo"><svg class="i"><use href="#i-book"/></svg></span>
      <h1 class="t-title1">登录拾光日记</h1>
      <p class="t-callout t-2">登录后，日记会在你的所有设备间同步。</p>
    </div>

    <form class="form" onsubmit="return false">
      <label class="field">
        <span class="field-label">邮箱</span>
        <input class="field-input" type="email" value="zhixia.lin@shiguang.me" placeholder="name@example.com" autocomplete="username">
      </label>
      <div class="field si-field">
        <label class="field-label" for="si-pw">密码</label>
        <div class="field-affix">
          <input class="field-input" id="si-pw" type="password" value="Guang0821!" autocomplete="current-password">
          <button class="icon-btn sm affix-end" type="button" aria-label="显示密码"><svg class="i"><use href="#i-eye"/></svg></button>
        </div>
      </div>
      <a class="si-forgot t-subhead t-accent" href="#">忘记密码？</a>
      <button class="btn filled lg block" type="submit">登录</button>
    </form>

    <div class="divider label">或</div>

    <div class="btn-stack">
      <button class="btn tonal lg block"><svg class="i"><use href="#i-key"/></svg>使用通行密钥登录</button>
      <button class="btn lg block si-apple only-apple">
        <svg class="si-glyph" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        通过 Apple 登录
      </button>
      <button class="btn outlined lg block si-google only-google">
        <svg class="si-glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        使用 Google 账号登录
      </button>
    </div>

    <p class="si-foot t-subhead t-2">还没有账号？<a class="t-accent t-semibold" href="#">注册</a></p>
  </main>
</div>
</body>
</html>
