<!doctype html>
<html lang="zh-CN" data-lang="apple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的家</title>
<meta name="ui:title" content="智能家居">
<meta name="ui:desc" content="家庭控制首页：室温、湿度、门锁与开启设备摘要，房间筛选，场景按钮，灯/空调/门锁/摄像头/扫地机磁贴和今日能耗。">
<meta name="ui:category" content="智能家居">
<meta name="ui:platform" content="phone">
<meta name="ui:tags" content="磁贴网格,场景,筛选片,摄像头画面,柱状图,标签栏">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../kit/icons.js"></script>
<script src="../../kit/ui.js"></script>
<style>
  .sh-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .sh-sum > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sh-sum .i { color: var(--c); margin-bottom: 2px; }
  .sh-sum b { font-size: calc(var(--fs-headline) * var(--ts)); font-weight: 600; font-variant-numeric: tabular-nums; }
  html[data-lang="google"] .sh-sum b { font-weight: 500; }
  .sh-scenes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sh-scene { align-items: center; gap: 8px; padding: 14px 4px 12px; font-size: calc(var(--fs-footnote) * var(--ts)); font-weight: 600; }
  .sh-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--tint) 18%, transparent); color: var(--tint); }
  html[data-scheme="dark"] .sh-ic { background: color-mix(in srgb, var(--tint) 28%, transparent); color: color-mix(in srgb, var(--tint) 72%, white); }
  .sh-scene.tinted .sh-ic, .sh-dev.tinted .sh-ic { background: var(--tint); color: #fff; }
  .sh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sh-dev { gap: 10px; min-height: 120px; text-align: left; justify-content: space-between; }
  .sh-dev .sh-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .sh-name { font-weight: 600; font-size: calc(var(--fs-subhead) * var(--ts)); }
  html[data-lang="google"] .sh-name { font-weight: 500; }
  .sh-state { font-size: calc(var(--fs-footnote) * var(--ts)); }
  html[data-lang="apple"] .sh-dev.tinted .sh-name { color: var(--ui-text); }
  .sh-dev.tinted .sh-state { color: inherit; opacity: .85; }
  .sh-temp { font: 600 calc(28px * var(--ts)) / 1 var(--ui-font-display); font-variant-numeric: tabular-nums; }
  html[data-lang="google"] .sh-temp { font-weight: 400; }
  .sh-cam { grid-column: span 2; }
  .sh-cam .art { aspect-ratio: 16 / 8; }
  .sh-live { position: absolute; left: 10px; top: 10px; background: var(--c-red); color: #fff; }
  .sh-camtime { position: absolute; right: 12px; bottom: 10px; font-size: calc(var(--fs-caption) * var(--ts)); color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / 50%); font-variant-numeric: tabular-nums; }
  .sh-energy { --tint: var(--c-green); min-height: 0; }
  html[data-lang="google"][data-scheme="dark"] .sh-energy { --tint: color-mix(in srgb, var(--c-green) 60%, white); }
  .sh-energy .bars { --bars-h: 64px; --bars-gap: 4px; }
  html[data-lang="google"] .sh-energy .bars > span { border-radius: 6px 6px 3px 3px; }
  .sh-energy .bars > span { --bar-color: color-mix(in srgb, var(--tint) 32%, transparent); }
  .sh-energy .bars > span.is-active { background: var(--tint); }
</style>
</head>
<body class="app">
<div class="screen">
  <header class="topbar has-large">
    <div class="topbar-lead"></div>
    <div class="topbar-title">我的家</div>
    <div class="topbar-trail">
      <button class="bar-btn" aria-label="添加配件"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="bar-btn" aria-label="更多"><svg class="i"><use href="#i-overflow"/></svg></button>
    </div>
  </header>

  <main class="content">
    <h1 class="page-title">我的家</h1>

    <section class="card pad sh-sum">
      <div style="--c:var(--c-orange)"><svg class="i sm"><use href="#i-thermometer"/></svg><b>24.5°</b><span class="t-caption2 t-2">室温</span></div>
      <div style="--c:var(--c-cyan)"><svg class="i sm"><use href="#i-droplet"/></svg><b>46%</b><span class="t-caption2 t-2">湿度</span></div>
      <div style="--c:var(--c-green)"><svg class="i sm"><use href="#i-lock"/></svg><b>已上锁</b><span class="t-caption2 t-2">入户门</span></div>
      <div style="--c:var(--c-yellow)"><svg class="i sm"><use href="#i-lightbulb"/></svg><b>2 台</b><span class="t-caption2 t-2">设备开启</span></div>
    </section>

    <div class="chips single bleed mt-4">
      <button class="chip is-active">全部</button><button class="chip">客厅</button><button class="chip">主卧</button><button class="chip">厨房</button><button class="chip">书房</button><button class="chip">儿童房</button><button class="chip">阳台</button>
    </div>

    <section class="group">
      <h2 class="group-header">常用场景 <a href="#">编辑</a></h2>
      <div class="sh-scenes">
        <button class="card sh-scene tinted"><span class="sh-ic" style="--tint:var(--c-orange)"><svg class="i"><use href="#i-home"/></svg></span>回家</button>
        <button class="card sh-scene"><span class="sh-ic" style="--tint:var(--c-blue)"><svg class="i"><use href="#i-logout"/></svg></span>离家</button>
        <button class="card sh-scene"><span class="sh-ic" style="--tint:var(--c-indigo)"><svg class="i"><use href="#i-moon"/></svg></span>睡眠</button>
        <button class="card sh-scene"><span class="sh-ic" style="--tint:var(--c-purple)"><svg class="i"><use href="#i-film"/></svg></span>观影</button>
      </div>
    </section>

    <section class="group">
      <h2 class="group-header">客厅 · 6 个配件</h2>
      <div class="sh-grid">
        <button class="card pad sh-dev tinted">
          <span class="sh-top"><span class="sh-ic" style="--tint:var(--c-yellow)"><svg class="i"><use href="#i-lightbulb-fill"/></svg></span><svg class="i sm"><use href="#i-power"/></svg></span>
          <span><span class="sh-name">客厅主灯</span><br><span class="sh-state">开启 · 亮度 80% · 暖白</span></span>
        </button>
        <button class="card pad sh-dev">
          <span class="sh-top"><span class="sh-ic" style="--tint:var(--c-cyan)"><svg class="i"><use href="#i-snowflake"/></svg></span><span class="sh-temp">24°</span></span>
          <span><span class="sh-name">客厅空调</span><br><span class="sh-state t-accent">制冷中 · 室内 26.5°C</span></span>
        </button>
        <button class="card pad sh-dev">
          <span class="sh-top"><span class="sh-ic" style="--tint:var(--c-gray)"><svg class="i"><use href="#i-lightbulb"/></svg></span></span>
          <span><span class="sh-name">落地灯</span><br><span class="sh-state t-2">关闭</span></span>
        </button>
        <button class="card pad sh-dev">
          <span class="sh-top"><span class="sh-ic" style="--tint:var(--c-green)"><svg class="i"><use href="#i-lock"/></svg></span><span class="t-caption t-2">电量 76%</span></span>
          <span><span class="sh-name">入户门锁</span><br><span class="sh-state t-success">已上锁 · 21:08 指纹开门</span></span>
        </button>
        <a class="card sh-cam" href="#">
          <div class="art a9 relative" role="img" aria-label="客厅摄像头实时画面">
            <svg class="i"><use href="#i-video"/></svg>
            <span class="tag sh-live">直播</span><span class="sh-camtime">10月23日 21:32:07</span>
          </div>
          <div class="card-body"><span class="sh-name">客厅摄像头</span><span class="sh-state t-2">今天 3 次移动侦测 · 最近 18:46</span></div>
        </a>
        <button class="card pad sh-dev sh-cam">
          <span class="sh-top"><span class="hstack gap-3"><span class="sh-ic" style="--tint:var(--c-teal)"><svg class="i"><use href="#i-refresh"/></svg></span><span><span class="sh-name">扫地机器人</span><br><span class="sh-state t-2">充电中 · 约 18 分钟充满</span></span></span><span class="t-headline t-num">82%</span></span>
          <span class="progress thick" style="--value:82%;--progress-fill:var(--c-teal)"></span>
        </button>
      </div>
    </section>

    <section class="group">
      <h2 class="group-header">能耗 <a href="#">详情</a></h2>
      <div class="widget wide sh-energy">
        <div class="hstack between base">
          <span class="widget-label"><svg class="i sm"><use href="#i-zap"/></svg>今日用电</span>
          <span class="t-footnote t-success">较昨日 −12%</span>
        </div>
        <span class="widget-value">8.6<span class="t-subhead t-2"> 度 · 约 ¥5.25</span></span>
        <div class="bars mt-2"><span style="--h:20%"></span><span style="--h:14%"></span><span style="--h:12%"></span><span style="--h:18%"></span><span style="--h:46%"></span><span style="--h:38%"></span><span style="--h:30%"></span><span style="--h:34%"></span><span style="--h:58%"></span><span style="--h:72%"></span><span class="is-active" style="--h:92%"></span><span style="--h:6%"></span></div>
        <div class="bars-labels"><span>0时</span><span></span><span>4</span><span></span><span>8</span><span></span><span>12</span><span></span><span>16</span><span></span><span>20</span><span></span></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tab is-active" href="#"><svg class="i"><use href="#i-home-fill"/></svg><span>家庭</span></a>
    <a class="tab" href="#"><svg class="i"><use href="#i-clock"/></svg><span>自动化</span></a>
    <a class="tab" href="#"><svg class="i"><use href="#i-compass"/></svg><span>发现</span></a>
  </nav>
</div>
</body>
</html>
