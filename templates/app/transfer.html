<!doctype html>
<html lang="zh-CN" data-lang="apple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>转账</title>
<meta name="ui:title" content="转账">
<meta name="ui:desc" content="银行转账页：收款人与卡号、带光标的大号金额输入、附言输入框、常用联系人、确认按钮和底部数字键盘。">
<meta name="ui:category" content="金融与支付">
<meta name="ui:platform" content="phone">
<meta name="ui:tags" content="金额输入,数字键盘,输入框,头像">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../kit/icons.js"></script>
<script src="../../kit/ui.js"></script>
<style>
  .tr-main { padding-bottom: calc(var(--safe-bottom) + 316px); }
  .tr-amount { gap: 4px; }
  .tr-input { display: flex; align-items: baseline; gap: 6px; padding: 4px 0 8px; border-bottom: 1px solid var(--ui-line); margin-bottom: 8px; }
  .tr-yen { font: 600 calc(28px * var(--ts)) / 1 var(--ui-font-display); }
  .tr-num { font: 700 calc(46px * var(--ts)) / 1.1 var(--ui-font-display); font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  html[data-lang="google"] .tr-num, html[data-lang="google"] .tr-yen { font-weight: 400; }
  .tr-caret { align-self: center; width: 2.5px; height: 44px; border-radius: 2px; background: var(--ui-accent); margin-left: -2px; animation: tr-blink 1.1s steps(1) infinite; }
  @keyframes tr-blink { 50% { opacity: 0; } }
  .tr-contacts { display: flex; gap: 14px; }
  .tr-ct { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px; flex: none; }
  .tr-ct.is-active .avatar { box-shadow: 0 0 0 2px var(--ui-bg), 0 0 0 4px var(--ui-accent); }
  .tr-pad { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px;
    padding: 12px 8px calc(var(--safe-bottom) + 8px); background: var(--ui-surface-2); border-top: .5px solid var(--ui-line); }
  html[data-lang="apple"] .tr-pad { background: var(--ui-surface-3); }
  html[data-lang="apple"][data-scheme="dark"] .tr-pad { background: var(--ui-surface); }
  .tr-pad > .btn { margin: 0 8px; width: auto; }
  .tr-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tr-keys .btn { --ui-btn-h: 46px; --ui-btn-radius: 9px; font: 500 calc(24px * var(--ts)) / 1 var(--ui-font-display); }
  html[data-lang="apple"] .tr-keys .btn { --b-bg: var(--ui-bg-plain); box-shadow: 0 1px 0 rgb(0 0 0 / 22%); }
  html[data-lang="apple"][data-scheme="dark"] .tr-keys .btn { --b-bg: var(--ui-surface-3); }
  html[data-lang="google"] .tr-keys .btn { --ui-btn-radius: 999px; font-weight: 400; }
  .tr-keys .tr-plain { --b-bg: transparent !important; box-shadow: none !important; }
  .tr-del { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="app">
<div class="screen">
  <header class="topbar">
    <div class="topbar-lead"><a class="bar-btn back" href="#"><svg class="i"><use href="#i-back"/></svg><span>首页</span></a></div>
    <div class="topbar-title">转账</div>
    <div class="topbar-trail"><button class="bar-btn" aria-label="转账记录"><svg class="i"><use href="#i-history"/></svg></button></div>
  </header>

  <main class="content tr-main">
    <ul class="list has-avatars mt-2">
      <li><div class="row">
        <span class="avatar" style="--c:linear-gradient(135deg,#ffb36b,#ff5e7e);--c-fg:#fff">王</span>
        <span class="row-body"><span class="row-title">王雨桐</span><span class="row-sub">招商银行 储蓄卡（尾号 4471）</span></span>
        <button class="btn tonal xs">更换</button>
      </div></li>
    </ul>

    <section class="card pad tr-amount mt-4">
      <span class="t-footnote t-2">转账金额</span>
      <div class="tr-input" aria-label="金额 3200 元">
        <span class="tr-yen">¥</span><span class="tr-num">3,200.00</span><span class="tr-caret"></span>
      </div>
      <div class="hstack between t-footnote t-2"><span>叁仟贰佰元整</span><span>今日剩余额度 ¥46,800.00</span></div>
    </section>

    <label class="field mt-4">
      <span class="field-label">转账附言</span>
      <input class="field-input" value="10月房租 · 宛平南路 88 弄" placeholder=" ">
    </label>

    <section class="mt-4">
      <h2 class="group-header">常用联系人 <a href="#">全部</a></h2>
      <div class="tr-contacts scroll-x">
        <a class="tr-ct is-active" href="#"><span class="avatar" style="--c:linear-gradient(135deg,#ffb36b,#ff5e7e);--c-fg:#fff">王</span><span class="t-caption">王雨桐</span></a>
        <a class="tr-ct" href="#"><span class="avatar" style="--c:var(--c-teal);--c-fg:#fff">林</span><span class="t-caption">林知夏</span></a>
        <a class="tr-ct" href="#"><span class="avatar" style="--c:var(--c-indigo);--c-fg:#fff">周</span><span class="t-caption">周屿</span></a>
        <a class="tr-ct" href="#"><span class="avatar" style="--c:var(--c-orange);--c-fg:#fff">妈</span><span class="t-caption">妈妈</span></a>
        <a class="tr-ct" href="#"><span class="avatar" style="--c:var(--c-pink);--c-fg:#fff">许</span><span class="t-caption">许念</span></a>
        <a class="tr-ct" href="#"><span class="avatar" style="--c:var(--c-green);--c-fg:#fff">陈</span><span class="t-caption">陈默</span></a>
      </div>
    </section>
  </main>

  <div class="tr-pad">
    <button class="btn filled lg block">确认转账 ¥3,200.00</button>
    <div class="tr-keys" aria-label="数字键盘">
      <button class="btn neutral">1</button><button class="btn neutral">2</button><button class="btn neutral">3</button>
      <button class="btn neutral">4</button><button class="btn neutral">5</button><button class="btn neutral">6</button>
      <button class="btn neutral">7</button><button class="btn neutral">8</button><button class="btn neutral">9</button>
      <button class="btn neutral tr-plain">.</button><button class="btn neutral">0</button>
      <button class="btn neutral tr-plain" aria-label="删除"><svg class="tr-del" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L2.5 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
