<!doctype html>
<html lang="zh-CN" data-lang="apple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · Kite</title>
<meta name="ui:title" content="网页登录与注册">
<meta name="ui:desc" content="全屏左右分栏的认证页：左侧品牌视觉与用户评价，右侧登录/注册切换、邮箱密码、记住我、通行密钥与 Apple、Google 第三方登录。">
<meta name="ui:category" content="账户与表单">
<meta name="ui:platform" content="web">
<meta name="ui:tags" content="登录,注册,通行密钥,第三方登录,分栏">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../kit/icons.js"></script>
<script src="../../kit/ui.js"></script>
<style>
  .au { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 100dvh; }
  .au-visual { display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; gap: 32px; padding: 40px 48px; }
  .au-visual .brand { font-size: 20px; }
  .au-visual .brand-mark { background: rgb(255 255 255 / 22%); color: #fff; }
  .au-pitch { display: flex; flex-direction: column; gap: 12px; max-width: 32em; }
  .au-pitch .t-hero { font-size: calc(clamp(36px, 3.8vw, 52px) * var(--ts)); text-wrap: balance; }
  .au-pitch .t-lead { max-width: 26em; text-wrap: pretty; }
  .au-float { align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 20px;
    background: rgb(255 255 255 / 14%); border: 1px solid rgb(255 255 255 / 24%); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .au-float .avatar-stack > .avatar { box-shadow: 0 0 0 2px rgb(255 255 255 / 70%); }
  .au-quote { max-width: 30em; padding-top: 28px; border-top: 1px solid rgb(255 255 255 / 24%); }
  .au-quote blockquote { text-wrap: pretty; }
  .au-quote figcaption { display: flex; align-items: center; gap: 12px; }
  .au-quote b { display: block; font-weight: 600; }
  .au-main { --ui-field-label-bg: var(--ui-bg-plain); display: grid; place-items: center; padding: 48px 24px; }
  .au-card { width: min(400px, 100%); display: flex; flex-direction: column; gap: 20px; }
  .au-head { display: flex; flex-direction: column; gap: 6px; }
  .au-mbrand { display: none; margin-bottom: 8px; }
  .au-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: calc(var(--fs-subhead) * var(--ts)); }
  .au-row label { display: flex; align-items: center; gap: 8px; }
  .au-row a, .au-legal a { color: var(--ui-accent); }
  .au-card .divider { margin: 0; }
  .au-sso .btn.outlined { --b-fg: var(--ui-text); }
  .au-sso .btn.inverse { --b-bg: var(--ui-inverse); --b-fg: var(--ui-on-inverse); --b-bd: transparent; }
  .au-logo { width: 20px; height: 20px; flex: none; }
  .au-legal { text-align: center; line-height: 1.6; }
  @media (max-width: 860px) { .au { grid-template-columns: 1fr; } .au-visual { display: none; } .au-mbrand { display: inline-flex; } .au-main { place-items: start center; padding-top: 40px; } }
</style>
</head>
<body class="site">
  <div class="au">
    <aside class="art a7 on-media au-visual">
      <a class="brand" href="#"><span class="brand-mark"><svg class="i"><use href="#i-zap"/></svg></span>Kite</a>
      <div class="au-pitch">
        <h2 class="t-hero">实时同步的<span class="nowrap">数据库，</span>前端直接用。</h2>
        <p class="t-lead t-2">2,300 个团队用 Kite 做协同文档、在线白板和多人游戏。</p>
        <div class="au-float mt-4">
          <span class="avatar-stack"><span class="avatar sm" style="--c:var(--c-orange)">周</span><span class="avatar sm" style="--c:var(--c-indigo)">林</span><span class="avatar sm" style="--c:var(--c-pink)">苏</span></span>
          <span class="t-footnote">3 人正在编辑 · 同步延迟 38 ms</span>
        </div>
      </div>
      <figure class="quote au-quote">
        <blockquote>“接入 Kite 之后，我们的协同编辑从立项到上线只用了 11 天，再也不用自己维护 WebSocket 集群。”</blockquote>
        <figcaption><span class="avatar" style="--c:rgb(255 255 255 / 24%)">周</span><span><b>周牧野</b><span class="t-footnote t-2">青柠笔记 技术负责人</span></span></figcaption>
      </figure>
    </aside>

    <main class="au-main">
      <div class="au-card">
        <div class="au-head">
          <a class="brand au-mbrand" href="#"><span class="brand-mark"><svg class="i"><use href="#i-zap"/></svg></span>Kite</a>
          <h1 class="t-title1">欢迎回来</h1>
          <p class="t-subhead t-2">登录以继续使用 Kite 控制台</p>
        </div>
        <div class="segmented"><button class="is-active">登录</button><button>注册</button></div>
        <form class="form" onsubmit="return false">
          <label class="field"><span class="field-label">邮箱</span><input class="field-input" type="email" value="muye@qingning.app" placeholder="name@company.com" autocomplete="username"></label>
          <label class="field"><span class="field-label">密码</span><input class="field-input" type="password" placeholder="至少 8 位" autocomplete="current-password"></label>
          <div class="au-row">
            <label><input type="checkbox" class="check" checked>记住我</label>
            <a href="#">忘记密码？</a>
          </div>
          <button class="btn filled lg block" type="submit">登录</button>
        </form>
        <div class="divider label">或</div>
        <div class="btn-stack au-sso">
          <button class="btn outlined lg block"><svg class="i"><use href="#i-key"/></svg>使用通行密钥登录</button>
          <button class="btn inverse lg block">
            <svg class="au-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
            通过 Apple 登录
          </button>
          <button class="btn outlined lg block">
            <svg class="au-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            通过 Google 登录
          </button>
        </div>
        <p class="t-footnote t-2 au-legal">还没有账户？<a href="#">免费注册</a>，每月含 50 万次读写。<br>继续即表示你同意 Kite 的<a href="#">服务条款</a>和<a href="#">隐私政策</a>。</p>
      </div>
    </main>
  </div>
</body>
</html>
